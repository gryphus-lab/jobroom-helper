# SonarQube project configuration
sonar.projectKey=gryphus-lab_jobroom-helper
sonar.projectName=jobroom-helper
sonar.projectVersion=0.1.0
sonar.organization=gryphus-lab

sonar.sources=src
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml

# Interactive live-browser diagnostics (DOM-capture helpers). These are
# operator tools that drive a real Chrome session and cannot be unit-tested,
# so they are excluded from analysis and from the new-code coverage gate.
sonar.exclusions=scripts/**
sonar.coverage.exclusions=scripts/**

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
